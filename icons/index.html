<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Asterio Icon Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1f4e79; --navy-d:#163a5a; --accent:#4a90c2; --ink:#16222e;
    --muted:#67788a; --bg:#f3f6fa; --line:#e3eaf2; --card:#fff;
    --shadow:0 14px 34px -18px rgba(20,40,70,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .en{font-family:"Plus Jakarta Sans",sans-serif}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .head{display:flex;align-items:center;gap:18px;padding:18px 0}
  .logo{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Plus Jakarta Sans"}
  .logo b{font-weight:800;font-size:17px;letter-spacing:.2px}
  .logo span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:2.5px;font-family:"Plus Jakarta Sans"}
  .search{position:relative;flex:1;max-width:440px}
  .search input{width:100%;font:inherit;font-size:15px;padding:12px 16px 12px 42px;border:1.5px solid var(--line);border-radius:999px;background:#fbfdff}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:20px 0 6px}
  .chip{font-size:13px;font-weight:700;padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:#41566b;transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .count{margin-left:auto;font-size:13px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px;padding:18px 0 60px}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center;text-align:center}
  .icard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfe0f0}
  .icard .thumb{width:96px;height:96px;display:grid;place-items:center;margin-bottom:14px;padding:6px}
  .icard .thumb img{max-width:84px;max-height:84px;object-fit:contain}
  .icard .nm{font-weight:700;font-size:14px}
  .icard .nm-en{font-size:11px;color:var(--muted);font-family:"Plus Jakarta Sans";text-transform:lowercase}
  .empty{text-align:center;color:var(--muted);padding:80px 0}

  /* modal */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,28,44,.55)}
  .modal.open{display:flex}
  .sheet{background:#fff;border-radius:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
  .sheet-top{display:grid;grid-template-columns:220px 1fr;gap:0}
  .preview{background:var(--bg);display:grid;place-items:center;padding:30px;border-right:1px solid var(--line)}
  .preview img{max-width:160px;max-height:160px;object-fit:contain}
  .meta{padding:26px 26px 22px;position:relative}
  .meta h2{font-size:22px;font-weight:800;margin-bottom:2px}
  .meta .en2{font-size:13px;color:var(--muted);font-family:"Plus Jakarta Sans";margin-bottom:14px}
  .meta .cat{display:inline-block;font-size:11px;font-weight:800;color:var(--navy);background:#e9f1fa;padding:4px 11px;border-radius:999px;margin-bottom:14px}
  .meta .desc{font-size:14px;color:#3c4d5e;margin-bottom:14px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
  .tags .t{font-size:12px;color:#51647a;background:#f0f4f9;border:1px solid var(--line);padding:4px 10px;border-radius:8px}
  .btns{display:flex;flex-wrap:wrap;gap:9px}
  .btn{font:inherit;font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn.primary:hover{background:var(--navy-d)}
  .foot{padding:0 26px 22px;font-size:11.5px;color:var(--muted);font-family:"Plus Jakarta Sans"}
  .close{position:absolute;top:16px;right:18px;width:30px;height:30px;border:none;background:#f0f4f9;border-radius:50%;cursor:pointer;font-size:16px;color:#5b6c7d}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:620px){
    .head{flex-wrap:wrap}
    .search{max-width:none;order:3;flex-basis:100%}
    .sheet-top{grid-template-columns:1fr}
    .preview{border-right:none;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div class="logo">
      <div class="mark en">A</div>
      <div><b>Icon Museum</b><span class="en">ASTERIO</span></div>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="アイコンを検索（例：旅行 / car / 取引）" autocomplete="off" />
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">該当するアイコンが見つかりませんでした。</div>
</main>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
const emptyEl = document.getElementById('empty');
const modal = document.getElementById('modal');
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

let ICONS = [];
let activeCat = 'すべて';

const thumbSrc = (ic) => ic.files.svg || ic.files.png;

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 1600); }

function matches(ic, q){
  if(!q) return true;
  const hay = [ic.name, ic.name_en, ic.category, ic.description, ...(ic.tags||[])].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(term => hay.includes(term));
}

function render(){
  const q = qEl.value.trim();
  const list = ICONS.filter(ic => (activeCat==='すべて' || ic.category===activeCat) && matches(ic, q));
  grid.innerHTML = list.map(ic => `
    <div class="icard" data-id="${ic.id}">
      <div class="thumb"><img loading="lazy" src="${thumbSrc(ic)}" alt="${ic.name}"></div>
      <div class="nm">${ic.name}</div>
      <div class="nm-en">${ic.name_en||''}</div>
    </div>`).join('');
  emptyEl.style.display = list.length ? 'none' : 'block';
  document.querySelector('.count')?.remove();
  const c = document.createElement('span'); c.className='count'; c.textContent = `${list.length} / ${ICONS.length} 件`;
  chipsEl.appendChild(c);
}

function renderChips(){
  const cats = ['すべて', ...Array.from(new Set(ICONS.map(i=>i.category).filter(Boolean)))];
  chipsEl.innerHTML = cats.map(c => `<button class="chip${c===activeCat?' active':''}" data-cat="${c}">${c}</button>`).join('');
}

function openModal(ic){
  sheet.innerHTML = `
    <button class="close" id="x">×</button>
    <div class="sheet-top">
      <div class="preview"><img src="${thumbSrc(ic)}" alt="${ic.name}"></div>
      <div class="meta">
        <h2>${ic.name}</h2>
        <div class="en2">${ic.name_en||''}</div>
        ${ic.category?`<span class="cat">${ic.category}</span>`:''}
        ${ic.description?`<div class="desc">${ic.description}</div>`:''}
        <div class="tags">${(ic.tags||[]).map(t=>`<span class="t">${t}</span>`).join('')}</div>
        <div class="btns">
          ${ic.files.svg?`<button class="btn primary" data-act="copy">SVGコピー</button>`:''}
          ${ic.files.svg?`<button class="btn" data-act="dlsvg">SVG DL</button>`:''}
          <button class="btn" data-act="dlpng">PNG DL</button>
        </div>
      </div>
    </div>
    <div class="foot">id: ${ic.id} ・ source: ${ic.source||'-'} ・ ${ic.brand_neutral?'brand-neutral':''} ・ ${ic.created_at||''}</div>`;
  modal.classList.add('open');
  document.getElementById('x').onclick = closeModal;
  sheet.querySelectorAll('[data-act]').forEach(b => b.onclick = () => action(b.dataset.act, ic));
}
function closeModal(){ modal.classList.remove('open'); }
modal.onclick = (e) => { if(e.target===modal) closeModal(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

async function action(act, ic){
  if(act==='copy'){
    try { const svg = await (await fetch(ic.files.svg)).text(); await navigator.clipboard.writeText(svg); toast('SVGコードをコピーしました'); }
    catch { toast('コピーに失敗しました'); }
  } else if(act==='dlsvg'){ download(ic.files.svg, ic.id+'.svg'); }
  else if(act==='dlpng'){ download(ic.files.png, ic.id+'.png'); }
}
function download(url, filename){
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

grid.addEventListener('click', e => { const c = e.target.closest('.icard'); if(c){ openModal(ICONS.find(i=>i.id===c.dataset.id)); } });
chipsEl.addEventListener('click', e => { const c = e.target.closest('.chip'); if(c){ activeCat = c.dataset.cat; renderChips(); render(); } });
qEl.addEventListener('input', render);

fetch('./icons.json').then(r=>r.json()).then(data => { ICONS = data; renderChips(); render(); })
  .catch(()=>{ emptyEl.textContent='台帳(icons.json)の読み込みに失敗しました。'; emptyEl.style.display='block'; });
</script>
</body>
</html>
